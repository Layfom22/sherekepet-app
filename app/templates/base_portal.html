<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}Portal del Dueño - SherekePet{% endblock %}</title>
    
    <!-- PWA Meta -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SherekePet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    },
                    minHeight: {
                        'touch': '44px'
                    }
                }
            }
        }
    </script>
    <style>
        .btn-touch {
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body class="h-full flex flex-col font-sans text-slate-800 antialiased selection:bg-indigo-500 selection:text-white pb-12 sm:pb-0">

    <!-- Header Portal del Dueño (Mobile-First Indigo Theme) -->
    <header class="sticky top-0 z-40 bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-md">
        <div class="max-w-md md:max-w-4xl mx-auto px-4 sm:px-6">
            <div class="flex justify-between items-center h-16">
                
                <!-- Logo & Brand Dueños -->
                <a href="/portal/dashboard" class="flex items-center space-x-2.5 group">
                    <div class="w-10 h-10 rounded-2xl bg-white/15 backdrop-blur-xs flex items-center justify-center text-xl shadow-xs group-hover:scale-105 transition-transform border border-white/20">
                        🐾
                    </div>
                    <div>
                        <div class="flex items-center space-x-1.5">
                            <span class="text-base sm:text-lg font-black tracking-tight text-white">
                                SherekePet
                            </span>
                            <span class="px-2 py-0.5 text-[10px] font-black uppercase tracking-wider bg-white/20 text-white rounded-full">
                                Dueños
                            </span>
                        </div>
                        <p class="text-[11px] text-indigo-100 font-medium">
                            📱 Portal del Dueño
                        </p>
                    </div>
                </a>

                <!-- Navegación Dueño -->
                <div class="flex items-center space-x-2">
                    <a 
                        href="/portal/dashboard" 
                        class="btn-touch px-3 py-1.5 text-xs font-bold text-white/90 hover:text-white bg-white/10 hover:bg-white/20 rounded-xl transition-colors"
                    >
                        Mis Mascotas
                    </a>
                    <a 
                        href="/portal/logout" 
                        class="btn-touch px-2.5 py-1.5 text-xs font-semibold text-indigo-200 hover:text-white hover:bg-white/10 rounded-xl transition-colors"
                        title="Cerrar sesión"
                    >
                        Salir
                    </a>
                </div>

            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-md md:max-w-4xl w-full mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer Mobile Discreto -->
    <footer class="py-6 text-center text-[11px] text-slate-400 mt-auto">
        <p>SherekePet &bull; Carnet Digital y Seguimiento de Mascotas</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
